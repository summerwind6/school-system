server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: school-system
  
  main:
    allow-bean-definition-overriding: true
  
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/school_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        # 生产环境保持关闭；如确需使用，应由环境变量显式启用并配置强凭据与网络边界。
        enabled: ${DRUID_CONSOLE_ENABLED:false}
        url-pattern: /druid/*
        reset-enable: false
        login-username: ${DRUID_CONSOLE_USERNAME:}
        login-password: ${DRUID_CONSOLE_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.school.system.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    # 默认仅输出框架警告与错误，避免 Shiro/MyBatis Bean 初始化提示淹没真正异常。
    root: warn
    # 保留本项目的启动、请求和业务日志。
    com.school.system: info
    org.springframework: warn
    org.apache.shiro: warn
    org.mybatis: warn
    com.alibaba.druid: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
